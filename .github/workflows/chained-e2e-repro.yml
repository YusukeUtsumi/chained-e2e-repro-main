name: 'Testing: E2E (Chained Repro)'

# Minimal mirror of google-gemini/gemini-cli .github/workflows/chained_e2e.yml
# (corpus clone 2026-11-13). It reproduces the chain mechanics only:
#   pull_request -> Trigger E2E (Repro) --artifact repo/sha--> workflow_run
#   -> checkout of the FORK repo@SHA -> run the PR-defined script with a
#   secret in env -> set a commit status on the fork SHA.
# Differences from the original, all deliberate and recorded in README.md:
#  - one e2e job instead of linux/mac/windows/evals; it runs the fork's
#    `npm run test:e2e-repro` script instead of `npm ci` + `npm run build` +
#    the repo's integration suite. The point under test is "whose code runs,
#    with what env", not the real test suite.
#  - runs on ubuntu-latest instead of the project's self-hosted pool.
#  - secret is a DUMMY value (DUMMY_SECRET) set by Yusuke in his own test
#    repo — never a real GEMINI_API_KEY. The check is whether the fork-side
#    script can read it, nothing more.
#  - status is set with GITHUB_TOKEN (permissions: statuses: write) instead
#    of the project's robot PAT (GEMINI_CLI_ROBOT_GITHUB_PAT). The mechanics
#    (status on the fork SHA, context name) are the same; the token differs.
#  - no merge_queue_skipper job (third-party action, irrelevant to the chain).
#  - no push / merge_group triggers — only workflow_run + workflow_dispatch,
#    so nothing runs except via the chain.

on:
  workflow_run:
    workflows: ['Trigger E2E (Repro)']
    types: ['completed']
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'SHA of the commit to test'
        required: true
      repo_name:
        description: 'Repository name (e.g., owner/repo)'
        required: true

permissions:
  contents: 'read'
  statuses: 'write'

jobs:
  download_repo_name:
    runs-on: 'ubuntu-latest'
    if: "${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}"
    outputs:
      repo_name: '${{ steps.output-repo-name.outputs.repo_name }}'
      head_sha: '${{ steps.output-repo-name.outputs.head_sha }}'
    steps:
      - name: 'Download the repo_name artifact'
        uses: 'actions/download-artifact@v5'
        env:
          RUN_ID: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}"
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          name: 'repo_name'
          run-id: '${{ env.RUN_ID }}'
          path: '${{ runner.temp }}/artifacts'
      - name: 'Output Repo Name and SHA'
        id: 'output-repo-name'
        uses: 'actions/github-script@v8'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const temp = '${{ runner.temp }}/artifacts';
            const repoPath = path.join(temp, 'repo_name');
            if (fs.existsSync(repoPath)) {
              core.setOutput('repo_name', String(fs.readFileSync(repoPath)).trim());
            }
            const shaPath = path.join(temp, 'head_sha');
            if (fs.existsSync(shaPath)) {
              core.setOutput('head_sha', String(fs.readFileSync(shaPath)).trim());
            }

  parse_run_context:
    name: 'Parse run context'
    runs-on: 'ubuntu-latest'
    needs: 'download_repo_name'
    if: "${{ always() }}"
    outputs:
      repository: '${{ steps.set_context.outputs.REPO }}'
      sha: '${{ steps.set_context.outputs.SHA }}'
    steps:
      - id: 'set_context'
        name: 'Set dynamic repository and SHA'
        env:
          REPO: '${{ needs.download_repo_name.outputs.repo_name || github.repository }}'
          SHA: '${{ needs.download_repo_name.outputs.head_sha || github.event.inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}'
        shell: 'bash'
        run: |
          echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

  set_pending_status:
    runs-on: 'ubuntu-latest'
    permissions: 'write-all'
    needs:
      - 'parse_run_context'
    if: "${{ always() }}"
    steps:
      - name: 'Set pending status'
        uses: 'myrotvorets/set-commit-status-action@master'
        with:
          allowForks: 'true'
          repo: '${{ github.repository }}'
          sha: '${{ needs.parse_run_context.outputs.sha }}'
          token: '${{ secrets.GITHUB_TOKEN }}'
          status: 'pending'
          context: 'E2E (Chained Repro)'

  e2e_repro:
    name: 'E2E Test (Repro)'
    needs:
      - 'parse_run_context'
    runs-on: 'ubuntu-latest'
    if: "${{ always() }}"
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955'
        with:
          ref: '${{ needs.parse_run_context.outputs.sha }}'
          repository: '${{ needs.parse_run_context.outputs.repository }}'
          persist-credentials: false

      - name: 'Set up Node.js 20.x'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20.x'

      - name: 'Run fork-defined E2E script'
        env:
          DUMMY_SECRET: '${{ secrets.DUMMY_SECRET }}'
        shell: 'bash'
        run: 'npm run test:e2e-repro'

  set_workflow_status:
    runs-on: 'ubuntu-latest'
    permissions: 'write-all'
    needs:
      - 'parse_run_context'
      - 'e2e_repro'
    if: "${{ always() }}"
    steps:
      - name: 'Set final status'
        uses: 'myrotvorets/set-commit-status-action@master'
        with:
          allowForks: 'true'
          repo: '${{ github.repository }}'
          sha: '${{ needs.parse_run_context.outputs.sha }}'
          token: '${{ secrets.GITHUB_TOKEN }}'
          status: '${{ needs.e2e_repro.result == ''success'' && ''success'' || ''failure'' }}'
          context: 'E2E (Chained Repro)'
