name: 'Trigger E2E (Repro)'

# Minimal mirror of google-gemini/gemini-cli .github/workflows/trigger_e2e.yml
# (corpus clone 2026-11-13, ~/workspace/colab-llm/goss/repos/google-gemini_gemini-cli/).
# Differences from the original, all deliberate and recorded in README.md:
#  - runs on ubuntu-latest (GitHub-hosted) instead of the project's self-hosted
#    pool 'gemini-cli-ubuntu-16-core' — the chain logic is identical, the
#    runner class is not being tested here.
#  - no `github.repository == 'google-gemini/gemini-cli'` gate (this runs in
#    Yusuke's own test repo, so the gate would be his repo name instead).
#  - workflow name carries "(Repro)" so runs are never confused with the real ones.

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Repository name (e.g., owner/repo)'
        required: false
        type: 'string'
      head_sha:
        description: 'SHA of the commit to test'
        required: false
        type: 'string'
  pull_request:

jobs:
  save_repo_name:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Save Repo name'
        env:
          REPO_NAME: '${{ github.event.inputs.repo_name || github.event.pull_request.head.repo.full_name }}'
          HEAD_SHA: '${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}" > ./pr/head_sha
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'repo_name'
          path: 'pr/'
  trigger_e2e:
    name: 'Trigger e2e'
    runs-on: 'ubuntu-latest'
    steps:
      - id: 'trigger-e2e'
        run: |
          echo "Trigger e2e workflow"
